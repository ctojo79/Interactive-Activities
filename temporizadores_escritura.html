<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporizadores</title><style>
:root{--n:#0b1f3a;--b:#173a67;--o:#f28c28;--y:#ffd85a;--m:#cbd6e6;--r:#ff8a80}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:var(--n);color:white;display:grid;place-items:center;padding:25px}.app{width:min(1200px,97vw);background:linear-gradient(var(--b),var(--n));border:3px solid var(--o);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px #0006}header{text-align:center;padding:25px;border-bottom:4px solid var(--y)}h1{font-size:clamp(2rem,4vw,3.3rem);margin:0}header p{color:var(--m)}main{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:34px}.timer{background:#ffffff12;border:1px solid #ffffff22;border-radius:24px;padding:30px 22px;text-align:center}.timer h2{color:var(--y);font-size:clamp(1.3rem,2.2vw,2rem);min-height:2.4em}.clock{font-size:clamp(5rem,10vw,8rem);font-weight:900;letter-spacing:-5px;font-variant-numeric:tabular-nums;margin:20px 0}.track{height:13px;background:#ffffff22;border-radius:20px;overflow:hidden;margin:0 0 28px}.bar{height:100%;width:100%;background:var(--y)}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:13px;padding:13px 17px;font-weight:900;font-size:1rem;cursor:pointer}.start{background:var(--o);color:white}.pause{background:var(--y);color:var(--n)}.reset{background:white;color:var(--n)}.status{color:var(--m);font-weight:bold;margin-top:18px;min-height:1.2em}.finished{border-color:var(--r)}.finished .clock{color:var(--r)}.finished .bar{background:var(--r)}footer{text-align:center;color:var(--m);padding:0 20px 25px}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><h1>⏱️ Tiempo de escritura</h1><p>Temporizadores para la práctica en clase</p></header><main>
<section class="timer" id="card1"><h2>Respuesta corta - tiempo estimado</h2><div class="clock" id="clock1">15:00</div><div class="track"><div class="bar" id="bar1"></div></div><div class="controls"><button class="start" onclick="start(1)">▶ Iniciar</button><button class="pause" onclick="pause(1)">⏸ Pausar</button><button class="reset" onclick="reset(1)">↻ Reiniciar</button></div><div class="status" id="status1">Listo</div></section>
<section class="timer" id="card2"><h2>Ensayo - tiempo estimado</h2><div class="clock" id="clock2">30:00</div><div class="track"><div class="bar" id="bar2"></div></div><div class="controls"><button class="start" onclick="start(2)">▶ Iniciar</button><button class="pause" onclick="pause(2)">⏸ Pausar</button><button class="reset" onclick="reset(2)">↻ Reiniciar</button></div><div class="status" id="status2">Listo</div></section>
</main><footer>Los dos temporizadores funcionan de manera independiente.</footer></div><script>
const T={1:{total:900,left:900,i:null},2:{total:1800,left:1800,i:null}};
function draw(n){let t=T[n],m=Math.floor(t.left/60),s=t.left%60;document.getElementById("clock"+n).textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");document.getElementById("bar"+n).style.width=(t.left/t.total*100)+"%"}
function start(n){let t=T[n];if(t.i||t.left<=0)return;document.getElementById("status"+n).textContent="En marcha...";t.i=setInterval(()=>{t.left--;draw(n);if(t.left<=0){clearInterval(t.i);t.i=null;document.getElementById("status"+n).textContent="¡Tiempo!";document.getElementById("card"+n).classList.add("finished");chime()}},1000)}
function pause(n){let t=T[n];if(t.i)clearInterval(t.i);t.i=null;if(t.left<t.total&&t.left>0)document.getElementById("status"+n).textContent="Pausado"}
function reset(n){let t=T[n];if(t.i)clearInterval(t.i);t.i=null;t.left=t.total;document.getElementById("status"+n).textContent="Listo";document.getElementById("card"+n).classList.remove("finished");draw(n)}
function chime(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),now=c.currentTime;[523,659,784].forEach((f,j)=>{let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.15,now+j*.2);g.gain.exponentialRampToValueAtTime(.001,now+j*.2+.5);o.start(now+j*.2);o.stop(now+j*.2+.5)})}catch(e){}}
</script></body></html>
